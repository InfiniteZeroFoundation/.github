name: Idea or improvement
description: Suggest a feature, improvement, research question or documentation change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas from everyone are welcome, whether code, research, docs, design or community. For open-ended discussion, you can also start a thread in [Discussions](https://github.com/InfiniteZeroFoundation/DevNet/discussions) or ask in [Telegram](https://t.me/+h46VS3AnO384ZGI8).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What would you like to see? Sketches, links and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
