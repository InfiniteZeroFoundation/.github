name: Bug report
description: Something isn't working as expected (dincli, contracts, model services or docs).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! **Found a security vulnerability?** Please don't file it here; follow our [security policy](https://github.com/InfiniteZeroFoundation/.github/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dincli (command-line tool)
        - Smart contracts
        - Model services (training, auditing, aggregation)
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dincli ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Paste any error messages. Remove private keys, passwords and other secrets first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. macOS 15, Python 3.12, develop @ 55c4b52, sepolia-op-devnet"
